[theme]
base = "dark"
primaryColor = "#3F5BFF"
backgroundColor = "#0A0D17"
secondaryBackgroundColor = "#121B2C"
textColor = "#F3F5FD"
linkColor = "#A8BCFF"
borderColor = "#2B3A56"
dataframeBorderColor = "#2B3A56"
dataframeHeaderBackgroundColor = "#19263D"
dataframeHeaderTextColor = "#DCE7FF"
font = "'Segoe UI', sans-serif"
headingFont = "'Segoe UI', sans-serif"
baseFontSize = 15
headingFontSizes = ["2rem", "1.5rem", "1.15rem", "1rem", "0.9rem", "0.8rem"]
headingFontWeights = [650, 650, 600, 600, 600, 600]
metricValueFontSize = "1.75rem"
metricValueFontWeight = 650
baseRadius = "12px"
buttonRadius = "9px"
showWidgetBorder = true
showSidebarBorder = true
greenColor = "#61DFC0"
blueColor = "#91AAFF"
orangeColor = "#FFC077"
redColor = "#FF8EAA"
violetColor = "#BAA4FF"
chartCategoricalColors = ["#7188FF", "#61DFC0", "#BAA4FF", "#FFC077", "#FF8EAA"]

[server]
port = 8501

[client]
toolbarMode = "minimal"

[theme.sidebar]
backgroundColor = "#0D1423"
secondaryBackgroundColor = "#17243A"
textColor = "#DCE7FF"
primaryColor = "#758AFF"
borderColor = "#2B3A56"
