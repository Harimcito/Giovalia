name: Crear instalador de escritorio para Windows

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "buscador.py"
      - "cotizador.py"
      - "historial.py"
      - "lector_ia.py"
      - "pdf_cotizacion.py"
      - "revisor.py"
      - "plantilla_cotizacion.xlsx"
      - "requirements.txt"
      - "requirements-desktop.txt"
      - "desktop_launcher.py"
      - "gioval_desktop.spec"
      - "installer/**"
      - ".github/workflows/build-desktop.yml"

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt

      - name: Empaquetar aplicación de escritorio
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean gioval_desktop.spec
          if (-not (Test-Path "dist/Gioval/Gioval.exe")) {
            throw "PyInstaller no generó dist/Gioval/Gioval.exe"
          }


      - name: Probar arranque del servidor empaquetado
        shell: pwsh
        run: |
          $probeDir = Join-Path $env:RUNNER_TEMP "gioval-desktop-smoke"
          New-Item -ItemType Directory -Force -Path $probeDir | Out-Null
          $env:GIOVAL_DATA_DIR = $probeDir
          $port = 18765
          $exe = (Resolve-Path "dist/Gioval/Gioval.exe").Path
          $outLog = Join-Path $probeDir "stdout.log"
          $errLog = Join-Path $probeDir "stderr.log"
          $process = Start-Process -FilePath $exe -ArgumentList @("--gioval-server", "--port", "$port") -WorkingDirectory $probeDir -PassThru -WindowStyle Hidden -RedirectStandardOutput $outLog -RedirectStandardError $errLog
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              if ($process.HasExited) {
                throw "El servidor de Giovalia se cerró antes de responder."
              }
              try {
                $response = Invoke-WebRequest -Uri "http://127.0.0.1:$port/_stcore/health" -TimeoutSec 2 -UseBasicParsing
                if ($response.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) {
              $stdout = if (Test-Path $outLog) { Get-Content $outLog -Raw } else { "" }
              $stderr = if (Test-Path $errLog) { Get-Content $errLog -Raw } else { "" }
              throw "El servidor empaquetado no respondió. stdout=$stdout stderr=$stderr"
            }
            Write-Host "OK: el servidor empaquetado respondió en localhost."
          } finally {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

      - name: Obtener instalador oficial de WebView2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "installer/webview2" | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "installer/webview2/MicrosoftEdgeWebview2Setup.exe"

      - name: Instalar compilador Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "No se pudo instalar Inno Setup" }

      - name: Compilar instalador
        shell: pwsh
        run: |
          $compiler = [System.IO.Path]::Combine([Environment]::GetFolderPath("ProgramFilesX86"), "Inno Setup 6\ISCC.exe")
          if (-not (Test-Path $compiler)) {
            $compiler = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $compiler)) { throw "No encuentro ISCC.exe" }
          & $compiler "installer/Gioval.iss"
          if ($LASTEXITCODE -ne 0) { throw "La compilación de Inno Setup falló" }
          if (-not (Test-Path "installer/Output/Gioval-Setup.exe")) {
            throw "No se generó installer/Output/Gioval-Setup.exe"
          }

      - name: Publicar instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Gioval-Instalador-Windows-x64
          path: installer/Output/Gioval-Setup.exe
          if-no-files-found: error
          retention-days: 30
