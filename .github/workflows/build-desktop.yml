name: Crear instalador de escritorio para Windows

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths:
      - "app.py"
      - "buscador.py"
      - "cotizador.py"
      - "historial.py"
      - "lector_ia.py"
      - "pdf_cotizacion.py"
      - "revisor.py"
      - "plantilla_cotizacion.xlsx"
      - "requirements.txt"
      - "requirements-desktop.txt"
      - "desktop_launcher.py"
      - "assets/**"
      - "radar_comercial/gioval_ui.py"
      - "radar_comercial/assets/**"
      - "render.yaml"
      - "SHARED_LIBRARY.md"
      - "GIOVAL_GRATIS.md"
      - "configurar_cliente_gioval.ps1"
      - "instalar_servidor_gioval.ps1"
      - "iniciar_servidor_gioval.ps1"
      - "instalar_servidor_gioval.bat"
      - "iniciar_servidor_gioval.bat"
      - "gioval_desktop.spec"
      - "installer/**"
      - ".github/workflows/build-desktop.yml"

jobs:
  build-windows-installer:
    runs-on: windows-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-desktop.txt

      - name: Validar scripts PowerShell del servidor y cliente
        shell: pwsh
        run: |
          $files = @("instalar_servidor_gioval.ps1", "iniciar_servidor_gioval.ps1", "configurar_cliente_gioval.ps1")
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $file), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Host $_.Message }
              throw "Sintaxis PowerShell inválida: $file"
            }
          }
          Write-Host "OK: scripts PowerShell válidos."

      - name: Instalar dependencias
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt

      - name: Empaquetar aplicación de escritorio
        shell: pwsh
        run: |
          if (-not (Test-Path "assets/gioval.ico")) { throw "No se encontró el icono de Gioval" }
          python -m PyInstaller --noconfirm --clean gioval_desktop.spec
          if (-not (Test-Path "dist/Gioval/Gioval.exe")) {
            throw "PyInstaller no generó dist/Gioval/Gioval.exe"
          }
          $installer = Get-Content "installer/Gioval.iss" -Raw
          if ($installer -notmatch '\{autodesktop\}\\Gioval') {
            throw "El instalador debe crear el acceso directo de Gioval en el escritorio"
          }


      - name: Verificar el paquete de escritorio
        shell: pwsh
        run: |
          $exe = (Resolve-Path "dist/Gioval/Gioval.exe").Path
          $process = Start-Process -FilePath $exe -ArgumentList @("--check-package") -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "El paquete de escritorio no pudo cargar sus dependencias de ventana."
          }
          Write-Host "OK: el cliente de escritorio y sus dependencias se cargaron correctamente."

      - name: Obtener instalador oficial de WebView2
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "installer/webview2" | Out-Null
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "installer/webview2/MicrosoftEdgeWebview2Setup.exe"

      - name: Instalar compilador Inno Setup
        shell: pwsh
        run: |
          choco install innosetup --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw "No se pudo instalar Inno Setup" }

      - name: Compilar instalador
        shell: pwsh
        run: |
          $compiler = [System.IO.Path]::Combine([Environment]::GetFolderPath("ProgramFilesX86"), "Inno Setup 6\ISCC.exe")
          if (-not (Test-Path $compiler)) {
            $compiler = "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          }
          if (-not (Test-Path $compiler)) { throw "No encuentro ISCC.exe" }
          & $compiler "installer/Gioval.iss"
          if ($LASTEXITCODE -ne 0) { throw "La compilación de Inno Setup falló" }
          if (-not (Test-Path "installer/Output/Gioval-Setup.exe")) {
            throw "No se generó installer/Output/Gioval-Setup.exe"
          }

      - name: Publicar instalador como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Gioval-Instalador-Windows-x64
          path: installer/Output/Gioval-Setup.exe
          if-no-files-found: error
          retention-days: 30
